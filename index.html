<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Weather + Live Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Outfit:wght@400;500&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{font-family:'Figtree','Google Sans',system-ui,'Segoe UI',sans-serif!important}
body{margin:0;background:#2f3236}
#w{position:relative;height:100vh;height:100dvh;min-height:480px;overflow:hidden}
#map{position:absolute;inset:0}
#tp,#bt{position:absolute;left:0;right:0;z-index:1000}
#tp{top:0}#bt{bottom:0}
.leaflet-top{top:calc(var(--t,165px) + 6px)}
.leaflet-bottom{bottom:calc(var(--b,185px) + 6px)}

/* header + controls */
#bar{background:rgba(47,50,54,.5);color:#fff;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#bar b{font-size:clamp(17px,1.8vw,24px)}
#bar input{min-width:0;flex:1 1 140px;max-width:240px}
#now{flex:1 1 220px}
#ctl{background:rgba(47,50,54,.5);color:#fff;padding:6px 8px;display:flex;gap:10px;align-items:center}
#sl{flex:1;min-width:0}
#bar button,#bar input,#ctl button{
  font-family:'Outfit',system-ui,sans-serif!important;font-weight:500;font-size:clamp(13px,1.2vw,16px);
  color:#fff;background:rgba(10,10,12,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.3);outline:none}
#bar button,#ctl button{cursor:pointer}
#bar button:hover,#ctl button:hover{background:rgba(70,74,80,.7)}
#bar input:focus{border-color:#00C0F0}
#bar input::placeholder{color:rgba(255,255,255,.55)}

/* hourly + daily strips */
#fc,#hr{display:flex;gap:8px;padding:10px 8px;background:rgba(47,50,54,.5);overflow-x:auto}
.d{flex:1;text-align:center;font-size:clamp(11px,1.05vw,15px);color:#fff;background:rgba(10,10,12,.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);
  box-shadow:0 4px 14px rgba(0,0,0,.35);border-radius:12px;padding:8px 4px;min-width:62px}
.d i{display:block;font-style:normal;font-size:clamp(22px,2.6vw,38px);margin:4px 0}
.d span.r{opacity:.7}
.h{flex:none;min-width:clamp(54px,5vw,76px)}
.h i{font-size:clamp(20px,2vw,30px)}
#fc .d{cursor:pointer}
#fc .d:hover{background:rgba(70,74,80,.6)}

/* composite weather icons */
.ic{position:relative;display:inline-block}
.sub{position:absolute;right:-5px;bottom:-2px;font-size:.5em}
.mo{position:absolute;left:-.3em;top:-.25em;font-size:.7em}
.cl{position:relative;z-index:1}

/* day detail popup */
#pop{position:absolute;z-index:1500;left:50%;transform:translateX(-50%);bottom:calc(var(--b,185px) + 10px);
  width:min(94%,480px);max-height:calc(100% - var(--t,165px) - var(--b,185px) - 24px);overflow:auto;box-sizing:border-box;
  padding:14px 16px;color:#fff;background:rgba(20,22,26,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.2);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:none}
#pop .ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#pop .ph i{font-style:normal;font-size:38px}
#pop .ph b{font-size:18px;display:block}
#pop .ph small{opacity:.75;font-size:14px}
#pop .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pop .g div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
#pop .g span{display:block;opacity:.65;font-size:12px}
#pop .g b{font-size:15px;font-weight:500}

@media(max-width:600px){#fc,#hr{gap:5px;padding:6px 5px}.d{padding:6px 2px}#ctl{padding:4px 6px}#bar{padding:6px}}
</style>
</head>
<body>
<div id="w">
  <div id="map"></div>
  <div id="tp">
    <div id="bar">
      <input id="q" placeholder="City or ZIP" value="Salt Lake City">
      <button onclick="go()">Search</button>
      <button onclick="loc()">Use my location</button>
      <span id="now">Loading...</span>
    </div>
    <div id="hr"></div>
  </div>
  <div id="bt">
    <div id="ctl">
      <button id="pb" onclick="tog()">Play</button>
      <input id="sl" type="range" min="0" max="0" value="0" oninput="pause();show(+this.value)">
      <span id="ts"></span>
    </div>
    <div id="fc"></div>
  </div>
  <div id="pop"></div>
</div>

<script>
var $ = function(id){return document.getElementById(id)};
var q=$('q'), now=$('now'), hr=$('hr'), fc=$('fc'), pop=$('pop'), tp=$('tp'), bt=$('bt'), sl=$('sl'), ts=$('ts'), pb=$('pb');
var ll=[40.76,-111.89], layers=[], times=[], cur=0, timer=null, loading=false, W=null;

/* ---------- map ---------- */
var m=L.map('map').setView(ll,7);
m.doubleClickZoom.disable();
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri, HERE, Garmin, OpenStreetMap contributors',maxZoom:19}).addTo(m);
var mk=L.marker(ll).addTo(m);
m.attributionControl.addAttribution('Radar &copy; <a href="https://www.rainviewer.com" target="_blank">RainViewer</a>');

// keep the pin centered between the top and bottom panels
function fit(){
  var s=document.documentElement.style;
  s.setProperty('--t',tp.offsetHeight+'px');
  s.setProperty('--b',bt.offsetHeight+'px');
  m.invalidateSize();
  m.setView(ll,m.getZoom(),{animate:false});
  m.panBy([0,(bt.offsetHeight-tp.offsetHeight)/2],{animate:false});
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

/* ---------- icons ---------- */
var SUN='\u2600\uFE0F', PCL='\u26C5', CLD='\u2601\uFE0F', MOON='\uD83C\uDF19', DROP='\uD83D\uDCA7',
    RAIN='\uD83C\uDF27\uFE0F', SHOWER='\uD83C\uDF26\uFE0F', SNOW='\uD83C\uDF28\uFE0F', STORM='\u26C8\uFE0F', FOG='\uD83C\uDF2B\uFE0F';
function iconDay(c,p){
  var snow=(c>=71&&c<=77)||c==85||c==86, wet=(c>=51&&c<=67)||(c>=80&&c<=82);
  if(p>=10&&p<20)return '<span class="ic">'+PCL+'<span class="sub">'+DROP+'</span></span>';
  if(c>=95)return p>=30?STORM:PCL;
  if(snow)return p>=50?SNOW:CLD;
  if(p>=50)return RAIN;
  if(wet)return p<10?PCL:SHOWER;
  return c==0?SUN:c<3?PCL:c==3?CLD:FOG;
}
// hour = 0-23 for hourly cards (night = before 7 AM or 7 PM and later); omit for daily
function icon(c,p,hour){
  var e=iconDay(c,p);
  if(hour==null||(hour>=7&&hour<19))return e;
  if(e.indexOf('<span')==0)return e.replace(PCL,MOON);
  if(e==SUN)return MOON;
  if(e==PCL)return '<span class="ic">'+MOON+'<span class="sub">'+CLD+'</span></span>';
  if(e==CLD)return '<span class="ic"><span class="mo">'+MOON+'</span><span class="cl">'+CLD+'</span></span>';
  if(e==SHOWER)return RAIN;
  return e;
}
function desc(c){
  return c==0?'Clear sky':c<3?'Partly cloudy':c==3?'Overcast':c<50?'Fog':c<58?'Drizzle':c<68?'Rain':c<78?'Snow':
         c<83?'Rain showers':c<87?'Snow showers':c<95?'Showers':'Thunderstorms';
}

/* ---------- radar ---------- */
function ensure(i){if(!m.hasLayer(layers[i]))layers[i].addTo(m)}
function show(i){
  ensure(i);
  layers.forEach(function(l,k){l.setOpacity(k==i?.7:0)});
  cur=i;sl.value=i;
  ts.textContent='Radar: '+new Date(times[i]*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(i==layers.length-1?' (latest)':'');
}
// Only the visible frame is kept on the map. Other frames are loaded gradually
// when Play is pressed, which keeps us under RainViewer's free request limit.
function pause(){
  clearInterval(timer);timer=null;loading=false;pb.textContent='Play';
  layers.forEach(function(l,k){if(k!=cur&&m.hasLayer(l))m.removeLayer(l)});
}
function tog(){
  if(timer||loading)return pause();
  loading=true;pb.textContent='Pause';
  layers.forEach(function(l,k){
    setTimeout(function(){if(!loading)return;ensure(k);l.setOpacity(k==cur?.7:0)},k*150);
  });
  setTimeout(function(){
    if(!loading)return;
    loading=false;
    timer=setInterval(function(){show((cur+1)%layers.length)},600);
  },layers.length*150+1500);
}
function radar(){
  fetch('https://api.rainviewer.com/public/weather-maps.json').then(function(r){return r.json()}).then(function(j){
    var was=!!timer||loading;pause();
    layers.forEach(function(l){if(m.hasLayer(l))m.removeLayer(l)});
    var f=j.radar.past;
    times=f.map(function(x){return x.time});
    // 512px tiles = about 4x fewer requests than 256px tiles
    layers=f.map(function(x){
      return L.tileLayer(j.host+x.path+'/512/{z}/{x}/{y}/2/1_1.png',{tileSize:512,zoomOffset:-1,opacity:0,maxNativeZoom:7,maxZoom:12});
    });
    sl.max=f.length-1;show(f.length-1);fit();
    if(was)tog();
  });
}

/* ---------- weather ---------- */
function wx(lat,lon,name){
  mk.setLatLng([lat,lon]);ll=[lat,lon];
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&current=temperature_2m,wind_speed_10m,relative_humidity_2m'+
    '&hourly=temperature_2m,weather_code,precipitation_probability'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,uv_index_max,precipitation_sum,snowfall_sum,precipitation_hours,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant'+
    '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=7';
  fetch(url).then(function(r){return r.json()}).then(function(j){
    W=j;var c=j.current,R=Math.round;
    now.innerHTML='<b>'+R(c.temperature_2m)+'F</b> '+name+' | Wind '+R(c.wind_speed_10m)+' mph | Humidity '+c.relative_humidity_2m+'%';

    // hourly strip: rest of today
    var h=j.hourly,today=c.time.slice(0,10),from=c.time.slice(0,13)+':00',o='';
    h.time.forEach(function(t,i){
      if(t.slice(0,10)==today&&t>=from){
        o+='<div class="d h"><b>'+new Date(t).toLocaleTimeString([],{hour:'numeric'})+'</b><i>'+
           icon(h.weather_code[i],h.precipitation_probability[i],+t.slice(11,13))+'</i>'+R(h.temperature_2m[i])+'F<br><span class="r">'+
           h.precipitation_probability[i]+'%</span></div>';
      }
    });
    hr.innerHTML=o;

    // 7-day strip
    var d=j.daily;
    fc.innerHTML=d.time.map(function(t,i){
      return '<div class="d"><b>'+new Date(t+'T12:00').toLocaleDateString([],{weekday:'short'})+'</b><i>'+
        icon(d.weather_code[i],d.precipitation_probability_max[i])+'</i>'+R(d.temperature_2m_max[i])+'/'+R(d.temperature_2m_min[i])+
        'F<br><span class="r">Rain '+d.precipitation_probability_max[i]+'%</span></div>';
    }).join('');
    fit();
  });
}

/* ---------- day detail popup ---------- */
function tm(s){return new Date(s).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function openDay(i){
  if(!W)return;
  var d=W.daily,R=Math.round,c=d.weather_code[i],p=d.precipitation_probability_max[i],
      dir=['N','NE','E','SE','S','SW','W','NW'][R(d.wind_direction_10m_dominant[i]/45)%8];
  var s=[
    ['High / Low',R(d.temperature_2m_max[i])+'F / '+R(d.temperature_2m_min[i])+'F'],
    ['Feels like',R(d.apparent_temperature_max[i])+'F / '+R(d.apparent_temperature_min[i])+'F'],
    ['Rain chance',p+'%'],
    ['Rain total',d.precipitation_sum[i].toFixed(2)+' in ('+d.precipitation_hours[i]+' hrs)'],
    ['Wind',R(d.wind_speed_10m_max[i])+' mph '+dir],
    ['Gusts',R(d.wind_gusts_10m_max[i])+' mph'],
    ['UV index',d.uv_index_max[i]],
    ['Sunrise / Sunset',tm(d.sunrise[i])+' / '+tm(d.sunset[i])]
  ];
  if(d.snowfall_sum[i]>0)s.splice(4,0,['Snowfall',d.snowfall_sum[i].toFixed(1)+' in']);
  pop.innerHTML='<div class="ph"><i>'+icon(c,p)+'</i><div><b>'+
    new Date(d.time[i]+'T12:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})+
    '</b><small>'+desc(c)+'</small></div></div><div class="g">'+
    s.map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('')+'</div>';
  pop.style.display='block';
}
fc.addEventListener('click',function(e){
  var c=e.target.closest('.d');
  if(c)openDay([].indexOf.call(fc.children,c));
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#pop')&&!e.target.closest('#fc .d'))pop.style.display='none';
});

/* ---------- search, location, map double-click ---------- */
function placeName(la,lo,fallback){
  return fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en&latitude='+la+'&longitude='+lo)
    .then(function(r){return r.json()})
    .then(function(g){return g.city||g.locality||g.principalSubdivision||fallback})
    .catch(function(){return fallback});
}
function go(){
  fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q.value))
    .then(function(r){return r.json()}).then(function(j){
      var r=j.results&&j.results[0];
      if(r)wx(r.latitude,r.longitude,r.name);else now.textContent='Not found';
    });
}
function loc(){
  if(!navigator.geolocation){now.textContent='Location not supported';return}
  now.textContent='Finding you...';
  navigator.geolocation.getCurrentPosition(function(p){
    var la=p.coords.latitude,lo=p.coords.longitude;
    placeName(la,lo,'My location').then(function(n){
      if(n!='My location')q.value=n;
      wx(la,lo,n);
    });
  },function(e){now.textContent='Location blocked: '+e.message});
}
m.on('dblclick',function(e){
  var la=e.latlng.lat,lo=e.latlng.lng;
  now.textContent='Loading...';
  placeName(la,lo,'Selected spot').then(function(n){q.value=n;wx(la,lo,n)});
});
q.addEventListener('keydown',function(e){if(e.key=='Enter')go()});

/* ---------- start ---------- */
wx(ll[0],ll[1],'Salt Lake City');
radar();
setInterval(radar,300000);
</script>
</body>
</html>
